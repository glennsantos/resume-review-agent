version: '3.8'

services:
  nats:
    image: nats:2.9.19
    ports:
      - "4222:4222"
    networks:
      - rra-net

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    depends_on:
      - nats
    environment:
      - NATS_SERVERS=nats://nats:4222
      - UPLOAD_DIR=uploads
    ports:
      - "8000:8000"
    volumes:
      - ./services/ingestion/uploads:/app/uploads
    networks:
      - rra-net

  normalizer:
    build:
      context: ./services/normalizer
      dockerfile: Dockerfile
    depends_on:
      - nats
    environment:
      - NATS_SERVERS=nats://nats:4222
    volumes:
      - ./services/ingestion/uploads:/app/uploads
    networks:
      - rra-net

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    depends_on:
      - ingestion
    environment:
      - REACT_APP_API_URL=http://ingestion:8000
    ports:
      - "3000:3000"
    networks:
      - rra-net

networks:
  rra-net:
    driver: bridge