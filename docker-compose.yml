version: '3.8'

services:
  nats:
    image: nats:2.9.19
    ports:
      - "4222:4222"
    networks:
      - rra-net

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    depends_on:
      - nats
    environment:
      - NATS_SERVERS=nats://nats:4222
      - UPLOAD_DIR=uploads
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./services/ingestion/uploads:/app/uploads
      - ./services/ingestion/jobs.db:/app/jobs.db
    networks:
      - rra-net

  normalizer:
    build:
      context: ./services/normalizer
      dockerfile: Dockerfile
    depends_on:
      - nats
    environment:
      - NATS_SERVERS=nats://nats:4222
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./services/ingestion/uploads:/app/uploads
      - ./services/ingestion/jobs.db:/app/jobs.db
    networks:
      - rra-net

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    depends_on:
      - ingestion
    ports:
      - "4000:4000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - rra-net

networks:
  rra-net:
    driver: bridge